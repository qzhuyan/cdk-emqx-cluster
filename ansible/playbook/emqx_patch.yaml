---
- name: patch emqx
  hosts: emqx
  tasks:
    - name: copy patch to emqx
      become: true
      become_user: root
      copy:
        src: "{{ item }}"
        dest: /var/lib/emqx/patches/
      with_fileglob:
        - patches/*.beam

    # - name: copy quicer
    #   become: true
    #   become_user: root
    #   copy:
    #     src: "{{ item }}"
    #     # @FIXME!
    #     dest: /usr/lib/emqx/lib/quicer-0.1.0/priv/
    #   with_fileglob:
    #     - patches/libquicer_nif.so.0.1.6-15-g34627a4

    - name: eval load command
      become: true
      become_user: root
      shell: |
        emqx eval 'c:lm()'
